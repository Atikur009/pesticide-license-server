# Pesticide Shop Calculator — License Server (Render Blueprint)
#
# Render free tier. Creates ONE web service. It does NOT create a database:
# Render allows only ONE free Postgres database per workspace and that slot
# is already used by atikur-smm-panel-db (the SMM panel). So this service
# shares that database — its tables are psc_-prefixed (psc_license_keys,
# psc_users) and never collide with the panel's tables (users, services,
# orders, ...). Durable storage — survives restarts and redeploys; the free
# disk of a Render web service is ephemeral and must NOT be relied on.
#
# Required env vars (set in the Render dashboard after first deploy — they
# are NEVER committed anywhere):
#   DATABASE_URL          — INTERNAL connection string of atikur-smm-panel-db
#                           (copy from that database's dashboard page)
#   LICENSE_SIGNING_KEY   — the RSA-2048 private key PEM (whole file, newlines kept)
#   LICENSE_ADMIN_SECRET  — the admin secret Atikur uses in keygen.html
# Optional:
#   LICENSE_DB_PATH       — only used if DATABASE_URL is not set (local dev)
#
# After deploy, in the Render dashboard set a custom domain
# license.atikur.cyou -> this service (Cloudflare CNAME), or use the
# *.onrender.com URL as the app's API base URL.

services:
  - type: web
    name: pesticide-license-server
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: LICENSE_SIGNING_KEY
        sync: false
      - key: LICENSE_ADMIN_SECRET
        sync: false
